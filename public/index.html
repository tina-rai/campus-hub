<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CampusHub</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header class="header">

        <div class="container">

            <div class="header-top">
                <div>
                    <h1>CampusHub</h1>
                    <p>Discover what's happening on campus.</p>
                </div>

                <div id="auth-area">
                    <a class="auth-link" href="/login.html">Log In</a>
                    <a class="auth-button" href="/signup.html">Sign Up</a>
                </div>
            </div>

            <nav class="navbar">
                <a href="/">Events</a>
                <a href="/my-registrations.html">My Registrations</a>
                <a id="admin-link" href="/admin.html" hidden>Admin Dashboard</a>
            </nav>

        </div>

    </header>

    <main class="container">

        <section class="filters">

            <div class="search-wrapper">
                <input type="text" id="search-input" placeholder="🔎 Search events by title, location or description...">
            </div>

            <div class="category-chips">

                <button class="chip active" data-category="">
                    All
                </button>

                <button class="chip" data-category="Workshop">
                    Workshop
                </button>

                <button class="chip" data-category="Competition">
                    Competition
                </button>

                <button class="chip" data-category="Seminar">
                    Seminar
                </button>

                <button class="chip" data-category="Club">
                    Club
                </button>

            </div>

            <div class="filter-row">

                <select id="sort-filter">
        
                    <option value="newest">
                        Upcoming First
                    </option>
        
                    <option value="oldest">
                        Oldest First
                    </option>
        
                </select>

                <button id="clear-filters" class="secondary-button">
                    Clear Filters
                </button>

            </div>

            <p id="results-count" class="results-count"></p>

        </section>

        <section class="events-section">

            <h2>Upcoming Events</h2>

            <div id="event-list">
                <p>Loading events...</p>
            </div>

        </section>

    </main>

    <script src="auth.js"></script>
    <script src="app.js"></script>

</body>

</html>
