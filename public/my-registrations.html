<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Registrations - CampusHub</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <header class="header">

        <div class="container">

            <h1>CampusHub</h1>

            <p>My Registrations</p>

        </div>

    </header>

    <main class="container">

        <section class="events-section">

            <h2>Find Your Registrations</h2>

            <form id="registration-search-form">

                <input type="email" id="student-email" placeholder="Enter your email" required>

                <button type="submit">
                    Find My Events
                </button>

            </form>

        </section>

        <section class="events-section">

            <h2>Registered Events</h2>

            <div id="my-registrations">
                <p>Enter your email to find your events.</p>
            </div>

        </section>

    </main>

    <script src="my-registrations.js"></script>

</body>

</html>
