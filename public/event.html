<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Event Details - CampusHub</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <header class="header">

        <div class="container">

            <h1>CampusHub</h1>

            <p>Event Details</p>

        </div>

    </header>

    <main class="container">

        <section id="event-details" class="events-section">
            <p>Loading event...</p>
        </section>

        <section id="registration-section" class="events-section registration-section">

            <h2>Register for this event</h2>

            <form id="registration-form">

                <input type="text" id="student-name" placeholder="Your name" required>

                <input type="email" id="student-email" placeholder="Your email" required>

                <button type="submit">
                    Register
                </button>

            </form>

            <p id="registration-message"></p>

        </section>
        <section class="events-section registration-list-section">

            <h2>Registered Students</h2>

            <div id="registration-list">
                <p>Loading registrations...</p>
            </div>

        </section>

    </main>

    <script src="event.js"></script>

</body>

</html>
