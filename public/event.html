<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Event Details - CampusHub</title>

    <link rel="stylesheet" href="style.css">
    <link
    rel="preconnect"
    href="https://fonts.googleapis.com"
>

<link
    rel="preconnect"
    href="https://fonts.gstatic.com"
    crossorigin
>

<link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
    rel="stylesheet"
>

</head>

<body>

    <header class="header">

        <div class="container">

            <div class="header-top">

                <div>
                    <h1>CampusHub</h1>
                    <p>Event Details</p>
                </div>

                <div id="auth-area">
                    <a class="auth-link" href="/login.html">Log In</a>
                    <a class="auth-button" href="/signup.html">Sign Up</a>
                </div>

            </div>

            <nav class="navbar">

                <a href="/">Events</a>

                <a href="/my-registrations.html">
                My Registrations
            </a>

                <a id="admin-link" href="/admin.html" hidden>
                Admin Dashboard
            </a>

            </nav>

        </div>

    </header>

    <main class="container">

        <section id="event-details" class="events-section">
            <p>Loading event...</p>
        </section>

        <section id="registration-section" class="events-section registration-section">

            <h2>Register for this event</h2>

            <p id="registration-status">
                Checking your login status...
            </p>

            <button id="register-button" class="primary-button" hidden>
            Register for Event
        </button>

            <p id="registration-message"></p>

        </section>

    </main>

    <script src="auth.js"></script>
    <script src="event.js"></script>

</body>

</html>
