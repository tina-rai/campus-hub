<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin Dashboard | CampusHub</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header class="header">
        <div class="container">

            <h1>CampusHub Admin</h1>

            <p>Manage campus events and registrations.</p>

            <nav class="navbar">
                <a href="/">Events</a>
                <a href="/admin.html">Admin Dashboard</a>
                <a href="#" id="logout-btn">Logout</a>
            </nav>

        </div>
    </header>

    <main class="container">

        <section class="events-section">

            <h2>Create New Event</h2>

            <form id="event-form" class="admin-form">

                <input type="text" id="title" placeholder="Event title" required>

                <textarea id="description" placeholder="Event description" required></textarea>

                <select id="category" required>
                    <option value="">Select category</option>
                    <option value="Workshop">Workshop</option>
                    <option value="Competition">Competition</option>
                    <option value="Seminar">Seminar</option>
                    <option value="Club">Club</option>
                </select>

                <input type="text" id="location" placeholder="Location" required>

                <input type="date" id="date" required>

                <input type="time" id="time" required>

                <input type="number" id="capacity" placeholder="Capacity" min="1" required>

                <button type="submit">
                    Create Event
                </button>

                <p id="event-message"></p>

            </form>

        </section>


        <section class="events-section admin-events-section">

            <h2>Manage Events</h2>

            <div id="admin-event-list">
                <p>Loading events...</p>
            </div>

        </section>

    </main>

    <script src="admin.js"></script>

</body>

</html>
